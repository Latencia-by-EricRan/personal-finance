<div class="login">
  <div class="login__container">
    <div class="login__brand">
      <app-logo-mark />
      <h1 class="login__wordmark">Norte</h1>
      <p class="login__tagline">Calm, precise money tracking</p>
    </div>

    <form class="login__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <app-norte-field
        label="Email"
        [errorMessage]="
          form.controls.email.invalid && form.controls.email.touched
            ? 'Enter a valid email.'
            : null
        "
      >
        <input
          id="email"
          type="email"
          class="norte-field__control"
          formControlName="email"
          autocomplete="email"
          placeholder="you@email.com"
        />
      </app-norte-field>

      <app-norte-field
        label="Password"
        [errorMessage]="
          form.controls.password.invalid && form.controls.password.touched
            ? 'Password is required.'
            : null
        "
      >
        <input
          id="password"
          type="password"
          class="norte-field__control"
          formControlName="password"
          autocomplete="current-password"
          placeholder="••••••••••"
        />
      </app-norte-field>

      @if (errorMessage()) {
        <p class="login__error">{{ errorMessage() }}</p>
      }

      <app-norte-button variant="primary" type="submit" [disabled]="form.invalid">
        Sign in
      </app-norte-button>
    </form>
  </div>
</div>
