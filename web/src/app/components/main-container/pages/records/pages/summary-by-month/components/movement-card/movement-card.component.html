@let _movement = this.movement();
<div class="movement-card">
  <div
    class="movement-card__icon"
    [class.movement-card__icon--income]="isIncome()"
    [class.movement-card__icon--expense]="!isIncome()"
  >
    <span class="movement-card__icon-glyph">{{ isIncome() ? '↑' : '↓' }}</span>
  </div>

  <div class="movement-card__meta">
    <span class="movement-card__title">{{ title() }}</span>
    <span class="movement-card__subtitle">
      <!-- IMovement currently has no dedicated Account field (known model gap) -->
      @if (_movement.Card) {
        {{ _movement.Card }} — {{ _movement.Date | date:'MMM d' }}
      } @else {
        {{ _movement.Date | date:'MMM d' }}
      }
    </span>
  </div>

  <span
    class="movement-card__amount"
    [class.movement-card__amount--income]="isIncome()"
    [class.movement-card__amount--expense]="!isIncome()"
  >{{ isIncome() ? '+' : '-' }}{{ _movement.Amount | currency }}</span>
</div>
