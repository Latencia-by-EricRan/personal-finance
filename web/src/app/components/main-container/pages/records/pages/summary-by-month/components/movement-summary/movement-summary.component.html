@let _summary = this.summary();
<div class="movement-summary">
  <app-stat-tile
    label="Income"
    [value]="(_summary.amount.income | currency) ?? ''"
    tone="income"
  />
  <app-stat-tile
    label="Expense"
    [value]="(_summary.amount.expense | currency) ?? ''"
    tone="expense"
  />
  <app-stat-tile
    label="Net"
    [value]="(net() | currency) ?? ''"
    tone="default"
  />
</div>
