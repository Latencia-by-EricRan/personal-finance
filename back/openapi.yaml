  /recurring/run:
    post:
      tags: [recurring]
      summary: Materialize due recurring templates into Movements
      description: >
        Idempotently materializes every active recurring template that hasn't
        already run for the current calendar month into a real Movement
        document, then stamps LastRunYearMonth so a second call within the
        same month is a no-op. DayOfMonth is clamped to the last valid day of
        the current month (e.g. DayOfMonth 31 in February resolves to the
        28th/29th, it never rolls into the next month). Returns the array of
        created Movements — an empty array (nothing was due) is a valid 200,
        not an error.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of created Movements (possibly empty)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Movement'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /report/by-category/{month}/{year}:
    get:
      tags: [report]
      summary: Get spending by category for a given month/year
      description: >
        Returns, for every distinct category with at least one egreso
        movement in the given month/year, the total Amount spent in that
        category.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: 1-based month number.
        - name: year
          in: path
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        '200':
          description: Bare array of category reports for the given month/year
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryReport'
        '400':
          description: Validation error (invalid month/year)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /report/monthly/{year}:
    get:
      tags: [report]
      summary: Get monthly income/expense trends for a given year
      description: >
        Returns exactly 12 entries, one per calendar month (January through
        December), even when a month has zero movements — so a chart
        consumer never has to backfill gaps.
      security:
        - bearerAuth: []
      parameters:
        - name: year
          in: path
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        '200':
          description: Array of exactly 12 monthly reports, one per calendar month
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MonthlyReport'
        '400':
          description: Validation error (invalid year)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /report/cashflow/{month}/{year}:
    get:
      tags: [report]
      summary: Get whole-ledger cashflow for a given month/year
      description: >
        Returns a single cashflow report (not an array) for the given
        month/year. Movement has no Account field yet (that integration is
        a separate, deferred slice), so this is a whole-ledger net — there
        is no per-account breakdown.
      security:
        - bearerAuth: []
      parameters:
        - name: month
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 12
          description: 1-based month number.
        - name: year
          in: path
          required: true
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
      responses:
        '200':
          description: Single cashflow report for the given month/year
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CashflowReport'
        '400':
          description: Validation error (invalid month/year)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Movement:
      type: object
      properties:
        _id:
          type: string
          readOnly: true
        Amount:
          type: number
        Category:
          type: string
          description: >
            ObjectId ref to Category; populated on GET /movement/month. Not
            required — transfer-generated movements (POST /account/transfer)
            have no Category, since they aren't tied to a spending category.
        Date:
          type: string
          format: date-time
        Type:
          type: string
          enum: [ingreso, egreso]
        Account:
          type: string
          description: ObjectId ref to Account. Required on every movement.
        TransferId:
          type: string
          readOnly: true
          description: >
            System-managed. Set only by POST /account/transfer to link the
            egreso/ingreso pair it creates. Never client-settable.
        Card:
          type: string
        Description:
          type: string
      required: [Amount, Date, Type, Account]

    Category:
      type: object
      properties:
        _id:
          type: string
          readOnly: true
        Name:
          type: string
        Description:
          type: string
        Tag:
          type: string
        Type:
          type: string
          enum: [variable, fijo]
        Icon:
          type: string
      required: [Name, Description, Tag, Type]

    Account:
      type: object
      properties:
        _id:
          type: string
          readOnly: true
        Name:
          type: string
        Type:
          type: string
          enum: [efectivo, banco, tarjeta]
        Currency:
          type: string
          default: ARS
        Icon:
          type: string
        Archived:
          type: boolean
          default: false
      required: [Name, Type]

    Budget:
      type: object
      properties:
        _id:
          type: string
          readOnly: true
        Category:
          type: string
          description: ObjectId ref to Category; populated on GET /budget/ and GET /budget/{id}
        Month:
          type: integer
          minimum: 1
          maximum: 12
        Year:
          type: integer
          minimum: 2000
          maximum: 2100
        Limit:
          type: number
          minimum: 0
      required: [Category, Month, Year, Limit]

    BudgetStatus:
      type: object
      description: >
        Computed spending status for a budget in a given month/year, derived
        from actual egreso movements in that category.
      properties:
        Category:
          type: string
          description: ObjectId ref to Category (populated)
        Limit:
          type: number
        Spent:
          type: number
          description: Sum of egreso movement Amounts for this category in the month.
        Remaining:
          type: number
          description: Limit minus Spent.
        Percent:
          type: number
          description: Spent as a percentage of Limit. 0 when Limit is 0 (no division by zero).

    Recurring:
      type: object
      description: >
        A template for a movement that repeats monthly. Materialized into
        real Movement documents via POST /recurring/run, carrying its
        Account field into each created Movement.
      properties:
        _id:
          type: string
          readOnly: true
        Type:
          type: string
          enum: [ingreso, egreso]
        Amount:
          type: number
        Category:
          type: string
          description: ObjectId ref to Category
        Account:
          type: string
          description: >
            ObjectId ref to Account. Required — propagated into every
            Movement materialized from this template by POST /recurring/run.
        Description:
          type: string
          default: ''
        Card:
          type: string
          default: ''
        Frequency:
          type: string
          enum: [mensual]
          default: mensual
        DayOfMonth:
          type: integer
          minimum: 1
          maximum: 31
        Active:
          type: boolean
          default: true
        LastRunYearMonth:
          type: string
          nullable: true
          readOnly: true
          description: >
            System-managed, format 'YYYY-MM'. Tracks the last month this
            template was materialized into a Movement. Not client-settable.
      required: [Type, Amount, Category, Account, DayOfMonth]

    CategoryBulkWriteResult:
      type: object
      description: MongoDB bulkWrite result returned by bulk category upserts.
      properties:
        matchedCount:
          type: integer
        modifiedCount:
          type: integer
        upsertedCount:
          type: integer
        insertedCount:
          type: integer
        deletedCount:
          type: integer

    MonthlySummary:
      type: object
      properties:
        month:
          type: integer
        year:
          type: integer
        summary:
          type: object
          properties:
            items:
              type: integer
              description: Count of movements in the period.
            amount:
              type: object
              description: Aggregate totals.
              properties:
                income:
                  type: number
                expense:
                  type: number
        movements:
          type: array
          items:
            $ref: '#/components/schemas/Movement'

    CategoryReport:
      type: object
      description: >
        Total egreso spending for one category in a given month/year. One
        entry per distinct category present in that month's expenses.
      properties:
        Category:
          type: string
          description: ObjectId ref to Category (populated)
        Total:
          type: number
          description: Sum of egreso movement Amounts for this category in the month.

    MonthlyReport:
      type: object
      description: >
        Income/expense/net totals for a single calendar month. GET
        /report/monthly/{year} always returns exactly 12 of these, one per
        month, even for months with zero movements.
      properties:
        Month:
          type: integer
          minimum: 1
          maximum: 12
        Income:
          type: number
          description: Sum of ingreso movement Amounts for the month.
        Expense:
          type: number
          description: Sum of egreso movement Amounts for the month.
        Net:
          type: number
          description: Income minus Expense.

    CashflowReport:
      type: object
      description: >
        Whole-ledger income/expense/net totals for a given month/year.
        Movement has no Account field yet, so there is no per-account
        breakdown.
      properties:
        Month:
          type: integer
          minimum: 1
          maximum: 12
        Year:
          type: integer
          minimum: 2000
          maximum: 2100
        Income:
          type: number
          description: Sum of ingreso movement Amounts in the month.
        Expense:
          type: number
          description: Sum of egreso movement Amounts in the month.
        Net:
          type: number
          description: Income minus Expense.

    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: array
          items:
            type: string
      required: [message]
