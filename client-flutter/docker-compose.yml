services:
  web:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - /app/build
    working_dir: /app
    command: >
      sh -c "flutter pub get &&
             flutter run -d web-server --web-hostname=0.0.0.0 --web-port=8080"

  # One-shot APK build — cirruslabs/flutter bundles a working Android SDK
  # (licenses pre-accepted), so this runs fully inside Docker with no local
  # Android toolchain needed. Unlike `web`, this does NOT shadow ./build with
  # an anonymous volume, so the APK lands in ./build on the host afterwards.
  # There is no iOS equivalent: Apple's toolchain requires Xcode on macOS,
  # which no Linux container can provide — an iOS build must run natively.
  #
  # Forced to amd64: Google only ships x86_64 Linux binaries for aapt2 and
  # several NDK toolchain executables (no native arm64-Linux build exists),
  # so on an Apple Silicon host these would otherwise run under a partial,
  # broken translation layer. Running the whole container under full amd64
  # emulation keeps every native tool on the same, consistent architecture.
  android:
    build: .
    platform: linux/amd64
    volumes:
      - .:/app
      - android-sdk-extras:/opt/android-sdk-linux/ndk
      - android-sdk-platforms:/opt/android-sdk-linux/platforms
      - android-sdk-cmake:/opt/android-sdk-linux/cmake
      - gradle-cache:/root/.gradle
    working_dir: /app
    # android/local.properties is host-machine-specific (gitignored, and
    # bind-mounted along with everything else in .:/app) — it records
    # whichever machine's Flutter SDK path last ran `flutter pub get`
    # against this checkout. Removing it first forces Flutter to regenerate
    # it fresh for THIS container's own SDK path instead of inheriting a
    # stale host (or previous-container) path that doesn't exist here.
    command: >
      sh -c "rm -f android/local.properties &&
             flutter pub get &&
             flutter build apk --debug"

volumes:
  android-sdk-extras:
  android-sdk-platforms:
  android-sdk-cmake:
  gradle-cache:
